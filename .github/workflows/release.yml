name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            asset_name: NetLite-windows-x86_64
          - os: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            asset_name: NetLite-linux-x86_64
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
            asset_name: NetLite-macos-x86_64
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            asset_name: NetLite-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (Ubuntu x86_64)
        if: matrix.os == 'ubuntu-22.04' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-x11-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\NetLite.exe -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Prepare artifact (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          strip target/${{ matrix.target }}/release/NetLite || true

      - name: Prepare artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          strip target/${{ matrix.target }}/release/NetLite || true

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          retention-days: 14

      - name: Upload artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/NetLite
          retention-days: 14

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get commit history
        id: get_commits
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          ALL_TAGS=$(git tag -l | sort -Vr)
          PREVIOUS_TAG=""
          found_current=false
          for tag in $ALL_TAGS; do
            if [ "$found_current" = true ]; then
              PREVIOUS_TAG=$tag
              break
            fi
            if [ "$tag" = "$CURRENT_TAG" ]; then
              found_current=true
            fi
          done

          REPO_URL=$(git config --get remote.origin.url | sed 's/\.git$//')

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%H %s" --no-merges)
          else
            COMMITS=$(git log $PREVIOUS_TAG..$CURRENT_TAG --pretty=format:"%H %s" --no-merges)
          fi

          FORMATTED_COMMITS=$(echo "$COMMITS" | while IFS= read -r line; do
            hash=$(echo "$line" | cut -d ' ' -f 1)
            msg=$(echo "$line" | cut -d ' ' -f 2-)
            if [[ ! "$msg" =~ ^build: && ! "$msg" =~ ^doc: ]]; then
              echo "- [$msg]($REPO_URL/commit/$hash)"
            fi
          done)

          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          echo "$FORMATTED_COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Body File
        id: create_body
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          COMMITS: ${{ steps.get_commits.outputs.COMMITS }}
        run: |
          cat > release_notes.md << 'EOF'
          ## NetLite VERSION_PLACEHOLDER

          ### 下载

          | 平台 | 架构 | 文件 |
          |------|------|------|
          | Windows | x86_64 | [NetLite-windows-x86_64.zip](https://github.com/kanebyqian/NetLite/releases/download/VERSION_PLACEHOLDER/NetLite-windows-x86_64.zip) |
          | Linux | x86_64 | [NetLite-linux-x86_64.tar.gz](https://github.com/kanebyqian/NetLite/releases/download/VERSION_PLACEHOLDER/NetLite-linux-x86_64.tar.gz) |
          | macOS | x86_64 (Intel) | [NetLite-macos-x86_64.tar.gz](https://github.com/kanebyqian/NetLite/releases/download/VERSION_PLACEHOLDER/NetLite-macos-x86_64.tar.gz) |
          | macOS | aarch64 (Apple Silicon) | [NetLite-macos-aarch64.tar.gz](https://github.com/kanebyqian/NetLite/releases/download/VERSION_PLACEHOLDER/NetLite-macos-aarch64.tar.gz) |

          ### 快速开始

          #### Windows
          下载 \`NetLite-windows-x86_64.zip\` 解压后运行 \`NetLite.exe\`。

          #### Linux
          \`\`\`bash
          tar -xzf NetLite-linux-x86_64.tar.gz
          chmod +x NetLite
          ./NetLite
          \`\`\`

          #### macOS
          \`\`\`bash
          tar -xzf NetLite-macos-x86_64.tar.gz
          chmod +x NetLite
          ./NetLite
          \`\`\`

          ### 系统要求

          - **Windows**: 10 或更高版本
          - **Linux**: GTK3 库 (\`libgtk-3-dev\` 等)
          - **macOS**: 10.15 或更高版本

          COMMITS_PLACEHOLDER
          EOF
          # Replace version placeholder
          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" release_notes.md
          # Replace commits placeholder
          if [ -n "$COMMITS" ]; then
            sed -i "/^COMMITS_PLACEHOLDER$/d" release_notes.md
            printf '%s\n' "${COMMITS}" >> release_notes.md
          else
            sed -i "/^COMMITS_PLACEHOLDER$/d" release_notes.md
          fi
          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Create Release
        run: |
          gh release create "$VERSION" \
            --title "NetLite $VERSION" \
            --notes-file release_notes.md \
            --draft=false \
            --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          COMMITS: ${{ steps.get_commits.outputs.COMMITS }}

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets

          # Windows: artifact contains NetLite-windows-x86_64.zip
          if [ -f artifacts/NetLite-windows-x86_64/NetLite-windows-x86_64.zip ]; then
            cp artifacts/NetLite-windows-x86_64/NetLite-windows-x86_64.zip release-assets/
            echo "Copied Windows zip"
          fi

          # Linux: artifact contains raw NetLite binary, create tar.gz
          if [ -f artifacts/NetLite-linux-x86_64/NetLite ]; then
            tar -czf release-assets/NetLite-linux-x86_64.tar.gz -C artifacts/NetLite-linux-x86_64 NetLite
            echo "Created Linux tar.gz"
          fi

          # macOS x86_64
          if [ -f artifacts/NetLite-macos-x86_64/NetLite ]; then
            tar -czf release-assets/NetLite-macos-x86_64.tar.gz -C artifacts/NetLite-macos-x86_64 NetLite
            echo "Created macOS x86_64 tar.gz"
          fi

          # macOS aarch64
          if [ -f artifacts/NetLite-macos-aarch64/NetLite ]; then
            tar -czf release-assets/NetLite-macos-aarch64.tar.gz -C artifacts/NetLite-macos-aarch64 NetLite
            echo "Created macOS aarch64 tar.gz"
          fi

          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Upload Release Assets
        run: |
          set -e
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "$VERSION" "$f" --clobber
            fi
          done
          echo "All assets uploaded successfully"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
